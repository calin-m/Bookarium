      <stop offset="65%" stop-color="#421406" stop-opacity="0.56" />
      <stop offset="74%" stop-color="#571d09" stop-opacity="0.42" />
      <stop offset="82%" stop-color="#70280e" stop-opacity="0.25" />
      <stop offset="91%" stop-color="#8c3515" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8c3515" stop-opacity="0" />
