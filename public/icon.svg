             C 232 392, 198 334, 156 296
             C 178 222, 192 142, 204 56 Z" fill="url(#gutter-center-left)" />
  </g>

  <g id="center-right-group">
    <path id="center-right" d="M 308 56
             C 276 96, 262 150, 262 216
             C 262 284, 266 376, 268 468
             C 280 392, 314 334, 356 296
             C 334 222, 320 142, 308 56 Z" fill="url(#grad-center-right)" />
    <path d="M 308 56
