    <linearGradient id="grad-wing-left" x1="36" y1="214" x2="108" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e4422" />
      <stop offset="42%" stop-color="#7b341e" />
      <stop offset="76%" stop-color="#521d0d" />
      <stop offset="100%" stop-color="#330f05" />
    </linearGradient>

    <linearGradient id="grad-tail-left" x1="170" y1="422" x2="140" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2e0d04" />
      <stop offset="48%" stop-color="#57200f" />
      <stop offset="100%" stop-color="#82361d" />
    </linearGradient>

    <linearGradient id="grad-wing-right" x1="476" y1="214" x2="404" y2="306" gradientUnits="userSpaceOnUse">
