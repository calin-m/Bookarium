name: Featured Quotes Sync

on:
  # Scheduled execution is unified inside catalog-sync.yml (Sundays 02:00 UTC);
  # this workflow remains available on-demand via workflow_dispatch for manual maintenance.
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max books to sync (reads strictly from private Cloudflare R2 books/<id>.txt.gz)'
        required: false
        type: string
        default: '50'
      target_count:
        description: 'Quotes per book (10-16)'
        required: false
        type: string
        default: '14'
      ids:
        description: 'Gutenberg IDs (blank = auto)'
        required: false
        type: string
        default: ''
      force_refresh:
        description: 'Overwrite existing quotes'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: featured-quotes-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Extract & Sync Featured Book Quotes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Featured Quotes Ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUTENBERG_CONTACT_EMAIL: ${{ secrets.GUTENBERG_CONTACT_EMAIL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_TARGET_COUNT: ${{ github.event.inputs.target_count }}
          INPUT_IDS: ${{ github.event.inputs.ids }}
          INPUT_FORCE: ${{ github.event.inputs.force_refresh }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          QUOTE_ARGS="--source=r2"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            QUOTE_ARGS="$QUOTE_ARGS --dry-run"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            QUOTE_ARGS="$QUOTE_ARGS --force"
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            if [[ ! "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
              echo "Error: limit input must be a positive integer." >&2
              exit 1
            fi
            QUOTE_ARGS="$QUOTE_ARGS --limit=$INPUT_LIMIT"
          fi
          if [ -n "$INPUT_TARGET_COUNT" ]; then
            if [[ ! "$INPUT_TARGET_COUNT" =~ ^(1[0-6])$ ]]; then
              echo "Error: target_count input must be an integer between 10 and 16." >&2
              exit 1
            fi
            QUOTE_ARGS="$QUOTE_ARGS --target-count=$INPUT_TARGET_COUNT"
          fi
          if [ -n "$INPUT_IDS" ]; then
            if [[ ! "$INPUT_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
              echo "Error: ids input must be a comma-separated list of positive integers." >&2
              exit 1
            fi
            QUOTE_ARGS="$QUOTE_ARGS --ids=$INPUT_IDS"
          fi
          node scripts/sync-featured-quotes.js $QUOTE_ARGS

      - name: Purge Vercel Edge Cache
        if: github.event.inputs.dry_run != 'true'
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: node scripts/purge-vercel-cache.js --tags=quotes
