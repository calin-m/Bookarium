name: Featured Quotes Sync

on:
  # Scheduled execution is unified inside catalog-sync.yml (Sundays 02:00 UTC);
  # this workflow remains available on-demand via workflow_dispatch for manual maintenance.
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max books to sync'
        required: false
        type: string
        default: '50'
      delay_range:
        description: 'Delay range in sec (min-max)'
        required: false
        type: string
        default: '8-16'
      target_count:
        description: 'Quotes per book (10-16)'
        required: false
        type: string
        default: '14'
      ids:
        description: 'Gutenberg IDs (blank = auto)'
        required: false
        type: string
        default: ''
      mirror_pglaf:
        description: 'Mirror: gutenberg.pglaf.org'
        required: false
        type: boolean
        default: true
      mirror_aleph:
        description: 'Mirror: aleph.gutenberg.org'
        required: false
        type: boolean
        default: false
      mirror_readingroo:
        description: 'Mirror: gutenberg.readingroo.ms'
        required: false
        type: boolean
        default: false
      force_refresh:
        description: 'Overwrite existing quotes'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: featured-quotes-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Extract & Sync Featured Book Quotes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Featured Quotes Ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUTENBERG_CONTACT_EMAIL: ${{ secrets.GUTENBERG_CONTACT_EMAIL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_DELAY_RANGE: ${{ github.event.inputs.delay_range }}
          INPUT_TARGET_COUNT: ${{ github.event.inputs.target_count }}
          INPUT_IDS: ${{ github.event.inputs.ids }}
          INPUT_MIRROR_PGLAF: ${{ github.event.inputs.mirror_pglaf }}
          INPUT_MIRROR_ALEPH: ${{ github.event.inputs.mirror_aleph }}
          INPUT_MIRROR_READINGROO: ${{ github.event.inputs.mirror_readingroo }}
          INPUT_FORCE: ${{ github.event.inputs.force_refresh }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          QUOTE_ARGS=""
          if [ "$EVENT_NAME" = "schedule" ]; then
            QUOTE_ARGS="$QUOTE_ARGS --mirrors=pglaf"
          else
            MIRRORS=""
            if [ "$INPUT_MIRROR_PGLAF" != "false" ]; then
              MIRRORS="pglaf"
            fi
            if [ "$INPUT_MIRROR_ALEPH" = "true" ]; then
              MIRRORS="${MIRRORS:+$MIRRORS,}aleph"
            fi
            if [ "$INPUT_MIRROR_READINGROO" = "true" ]; then
              MIRRORS="${MIRRORS:+$MIRRORS,}readingroo"
            fi
            if [ -z "$MIRRORS" ]; then
              echo "Error: At least one mirror worker must be checked." >&2
              exit 1
            fi
            QUOTE_ARGS="$QUOTE_ARGS --mirrors=$MIRRORS"
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            QUOTE_ARGS="$QUOTE_ARGS --dry-run"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            QUOTE_ARGS="$QUOTE_ARGS --force"
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            if [[ ! "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
              echo "Error: limit input must be a positive integer." >&2
              exit 1
            fi
            QUOTE_ARGS="$QUOTE_ARGS --limit=$INPUT_LIMIT"
          fi
          if [ -n "$INPUT_DELAY_RANGE" ]; then
            if [[ ! "$INPUT_DELAY_RANGE" =~ ^[0-9]+(\.[0-9]+)?-[0-9]+(\.[0-9]+)?$ ]]; then
              echo "Error: delay_range input must be min-max numbers (e.g. 8-16)." >&2
              exit 1
            fi
            QUOTE_ARGS="$QUOTE_ARGS --delay-range=$INPUT_DELAY_RANGE"
          fi
          if [ -n "$INPUT_TARGET_COUNT" ]; then
            if [[ ! "$INPUT_TARGET_COUNT" =~ ^(1[0-6])$ ]]; then
              echo "Error: target_count input must be an integer between 10 and 16." >&2
              exit 1
            fi
            QUOTE_ARGS="$QUOTE_ARGS --target-count=$INPUT_TARGET_COUNT"
          fi
          if [ -n "$INPUT_IDS" ]; then
            if [[ ! "$INPUT_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
              echo "Error: ids input must be a comma-separated list of positive integers." >&2
              exit 1
            fi
            QUOTE_ARGS="$QUOTE_ARGS --ids=$INPUT_IDS"
          fi
          node scripts/sync-featured-quotes.js $QUOTE_ARGS
