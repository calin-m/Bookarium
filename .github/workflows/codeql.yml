name: 'CodeQL SAST Analysis'
run-name: 'CodeQL SAST (${{ github.event_name }} on ${{ github.ref_name }})'

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  schedule:
    # Run every Monday at 01:30 UTC (staggered away from Sunday catalog-sync)
    - cron: '30 1 * * 1'

permissions:
  contents: read

concurrency:
  group: 'codeql-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  analyze:
    name: 'Analyze (${{ matrix.language }})'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: '${{ matrix.language }}'

      - name: 'Perform CodeQL Analysis'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
