name: Gutenberg Translations Sync

on:
  # Scheduled execution is unified inside catalog-sync.yml (Sundays 02:00 UTC);
  # this workflow remains available on-demand via workflow_dispatch for manual maintenance.
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum Wikidata statements to process (leave blank for all)'
        required: false
        type: string
      update_existing:
        description: 'Force overwrite existing translation records (default: false)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (parse and cluster without writing to database)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gutenberg-translations-sync
  cancel-in-progress: false

jobs:
  sync-translations:
    name: Cluster & Sync Book Translations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Translations Clustering
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUTENBERG_CONTACT_EMAIL: ${{ secrets.GUTENBERG_CONTACT_EMAIL }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_UPDATE_EXISTING: ${{ github.event.inputs.update_existing }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          TRANS_ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            TRANS_ARGS="$TRANS_ARGS --dry-run"
          fi
          if [ "$INPUT_UPDATE_EXISTING" = "true" ]; then
            TRANS_ARGS="$TRANS_ARGS --update-existing"
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            if [[ ! "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
              echo "Error: limit input must be a positive integer." >&2
              exit 1
            fi
            TRANS_ARGS="$TRANS_ARGS --limit=$INPUT_LIMIT"
          else
            TRANS_ARGS="$TRANS_ARGS --all"
          fi
          node scripts/ingest-translations.js $TRANS_ARGS

      - name: Purge Vercel Edge Cache
        if: github.event.inputs.dry_run != 'true'
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: node scripts/purge-vercel-cache.js --tags=translations

