name: Gutenberg Catalog Sync

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum titles to ingest (leave blank for all ~72,000)'
        required: false
        type: string
      update_existing:
        description: 'Force full rebuild of all records (leave false for smart diff sync)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (parse and validate without writing to database)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gutenberg-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Stream & Sync Gutenberg Catalog, Translations & Quotes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Restore Catalog Snapshot Cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download catalog-cache -p "gutenberg-catalog-cache.json.gz" --clobber || echo "No prior catalog-cache release asset found; starting cold-start sync."

      - name: Run Gutenberg Catalog Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUTENBERG_CONTACT_EMAIL: ${{ secrets.GUTENBERG_CONTACT_EMAIL }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_UPDATE_EXISTING: ${{ github.event.inputs.update_existing }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          CMD_ARGS="--cache-file=gutenberg-catalog-cache.json.gz --diff-output=quote-diff.json"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi
          if [ "$INPUT_UPDATE_EXISTING" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --update-existing"
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            if [[ ! "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
              echo "Error: limit input must be a positive integer." >&2
              exit 1
            fi
            CMD_ARGS="$CMD_ARGS --limit=$INPUT_LIMIT"
          fi
          node scripts/sync-gutenberg-catalog.js $CMD_ARGS

      - name: Publish Updated Catalog Snapshot Cache
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ "$INPUT_DRY_RUN" != "true" ] && [ -z "$INPUT_LIMIT" ] && [ -f "gutenberg-catalog-cache.json.gz" ]; then
            if gh release view catalog-cache >/dev/null 2>&1; then
              gh release upload catalog-cache gutenberg-catalog-cache.json.gz --clobber
            else
              gh release create catalog-cache gutenberg-catalog-cache.json.gz \
                --title "Gutenberg Catalog Snapshot Cache" \
                --notes "Permanent weekly compressed metadata snapshot (gutenberg-catalog-cache.json.gz) for zero-egress in-memory catalog diffing."
            fi
          fi

      - name: Run Relational Translations Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUTENBERG_CONTACT_EMAIL: ${{ secrets.GUTENBERG_CONTACT_EMAIL }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_UPDATE_EXISTING: ${{ github.event.inputs.update_existing }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          TRANS_ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            TRANS_ARGS="$TRANS_ARGS --dry-run"
          fi
          if [ "$INPUT_UPDATE_EXISTING" = "true" ]; then
            TRANS_ARGS="$TRANS_ARGS --update-existing"
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            if [[ ! "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
              echo "Error: limit input must be a positive integer." >&2
              exit 1
            fi
            TRANS_ARGS="$TRANS_ARGS --limit=$INPUT_LIMIT"
          else
            TRANS_ARGS="$TRANS_ARGS --all"
          fi
          node scripts/ingest-translations.js $TRANS_ARGS

      - name: Run Featured Quotes Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUTENBERG_CONTACT_EMAIL: ${{ secrets.GUTENBERG_CONTACT_EMAIL }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          QUOTE_ARGS="--mirrors=pglaf"
          if [ -f "quote-diff.json" ]; then
            QUOTE_ARGS="$QUOTE_ARGS --diff-file=quote-diff.json"
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            QUOTE_ARGS="$QUOTE_ARGS --dry-run"
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            if [[ ! "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
              echo "Error: limit input must be a positive integer." >&2
              exit 1
            fi
            QUOTE_ARGS="$QUOTE_ARGS --limit=$INPUT_LIMIT"
          fi
          node scripts/sync-featured-quotes.js $QUOTE_ARGS

