name: Gutenberg Catalog Sync

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum titles to ingest (leave blank for all ~72,000)'
        required: false
        type: string
      update_existing:
        description: 'Force overwrite existing books (default: false / skip existing)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (parse and validate without writing to database)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    name: Stream & Sync Gutenberg Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Gutenberg Catalog Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_UPDATE_EXISTING: ${{ github.event.inputs.update_existing }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          CMD_ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi
          if [ "$INPUT_UPDATE_EXISTING" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --update-existing"
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            if [[ ! "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
              echo "Error: limit input must be a positive integer." >&2
              exit 1
            fi
            CMD_ARGS="$CMD_ARGS --limit=$INPUT_LIMIT"
          fi
          node scripts/sync-gutenberg-catalog.js $CMD_ARGS

      - name: Run Relational Translations Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_UPDATE_EXISTING: ${{ github.event.inputs.update_existing }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          TRANS_ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            TRANS_ARGS="$TRANS_ARGS --dry-run"
          fi
          if [ "$INPUT_UPDATE_EXISTING" = "true" ]; then
            TRANS_ARGS="$TRANS_ARGS --update-existing"
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            if [[ ! "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
              echo "Error: limit input must be a positive integer." >&2
              exit 1
            fi
            TRANS_ARGS="$TRANS_ARGS --limit=$INPUT_LIMIT"
          else
            TRANS_ARGS="$TRANS_ARGS --all"
          fi
          node scripts/ingest-translations.js $TRANS_ARGS

