name: Automated Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.9.0)'
        required: true
        default: 'v1.9.0'

permissions:
  contents: write

jobs:
  release:
    name: Verify, Extract Notes & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run 7-Gateway Quality Engine
        run: npm run verify

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          node -e '
            const fs = require("fs");
            const tag = (process.env.GITHUB_REF_NAME || "${{ github.event.inputs.tag }}").replace(/^v/, "");
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const escapedTag = tag.replace(/\./g, "\\.");
            const regex = new RegExp("## \\[" + escapedTag + "\\][\\s\\S]*?(?=\\n## \\[|$)", "i");
            const match = changelog.match(regex);
            if (match) {
              const cleaned = match[0].replace(/^## \\[.*?\\]\\s*-\\s*\\d{4}-\\d{2}-\\d{2}\\s*/i, "").trim();
              fs.writeFileSync("RELEASE_NOTES.md", cleaned);
            } else {
              fs.writeFileSync("RELEASE_NOTES.md", "### Release v" + tag + "\n\nSee [CHANGELOG.md](CHANGELOG.md) for detailed notes.");
            }
          '

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Bookarium ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

