name: Automated Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v2.9.73)'
        required: true
        default: 'v2.9.73'

permissions:
  contents: read

jobs:
  release:
    name: Verify, Extract Notes & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run 7-Gateway Quality Engine
        run: npm run verify

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          node -e '
            const fs = require("fs");
            const rawTag = process.env.INPUT_TAG || process.env.GITHUB_REF_NAME || "";
            const tag = rawTag.replace(/^v/, "").trim();
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const headerMarker = "## [" + tag + "]";
            const startIdx = changelog.indexOf(headerMarker);
            if (startIdx !== -1) {
              const nextHeaderIdx = changelog.indexOf("\n## [", startIdx + headerMarker.length);
              const rawSection =
                nextHeaderIdx !== -1
                  ? changelog.slice(startIdx, nextHeaderIdx)
                  : changelog.slice(startIdx);
              const cleaned = rawSection.replace(/^## \[.*?\]\s*-\s*\d{4}-\d{2}-\d{2}\s*/i, "").trim();
              fs.writeFileSync("RELEASE_NOTES.md", cleaned);
            } else {
              fs.writeFileSync("RELEASE_NOTES.md", "### Release v" + tag + "\n\nSee [CHANGELOG.md](CHANGELOG.md) for detailed notes.");
            }
          '

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Bookarium ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
