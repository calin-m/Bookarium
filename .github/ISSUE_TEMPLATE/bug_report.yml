name: 🐛 Bug Report
description: Report an issue, rendering glitch, or unexpected behavior in Bookarium.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **Bookarium**!
        Please ensure you are testing against the latest deployment or `master` branch.

  - type: input
    id: version
    attributes:
      label: Bookarium Version / Release
      description: What version or release of Bookarium are you using?
      placeholder: "e.g. v2.9.26, latest master, or bookarium.vercel.app"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity & Impact Priority
      description: How severely does this issue affect your ability to read or browse Bookarium?
      options:
        - "Low — Minor visual glitch, cosmetic typo, or styling imperfection"
        - "Medium — Feature impaired but usable via workaround"
        - "High — Major feature broken (e.g. reader crash, downloads failing, settings not saving)"
        - "Critical — Complete blocker (e.g. white screen of death, unhandled fatal crash, data loss)"
    validations:
      required: true

  - type: input
    id: book_id
    attributes:
      label: Project Gutenberg Book ID (Optional)
      description: If the issue occurred while browsing, parsing, or reading a specific book, provide its ID.
      placeholder: "e.g. 1342 (Pride and Prejudice), 53419 (Twenty-Five Ghost Stories)"
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Device Category & Environment
      description: Which device category and environment did this issue occur on?
      options:
        - PC / Laptop (Desktop Browser: Chrome / Edge / Brave)
        - PC / Laptop (Desktop Browser: Firefox)
        - PC / Laptop (Desktop Browser: Safari / macOS)
        - Tablet / iPad (Browser: Safari / Chrome)
        - Mobile / Smartphone (Browser: iOS Safari)
        - Mobile / Smartphone (Browser: Android Chrome)
        - Installed PWA (Desktop PC / Mac)
        - Installed PWA (Tablet / iPad)
        - Installed PWA (Mobile Phone)
    validations:
      required: true

  - type: dropdown
    id: screen_aspect_ratio
    attributes:
      label: Screen Orientation & Aspect Ratio
      description: What is the screen orientation and approximate aspect ratio of the device?
      options:
        - "Horizontal / Landscape (16:9, 16:10, 21:9 Widescreen PC or Tablet)"
        - "Vertical / Portrait (9:16, 9:19.5, 9:20 Mobile Phone or Vertical Monitor)"
        - "Square / Near-Square (4:3 Tablet / iPad, 3:2 Laptop, ~1:1 Foldable Display)"
        - "Multi-Window / Split-Screen (Half-Screen Snapped or Floating Window)"
    validations:
      required: true

  - type: dropdown
    id: theme_mode
    attributes:
      label: Active Atmosphere Theme
      description: Which theme was active when the issue occurred?
      options:
        - Light Mode
        - Sepia Mode
        - Dark Mode
        - Not Applicable / General UI
    validations:
      required: true

  - type: dropdown
    id: network_mode
    attributes:
      label: Network & Offline State
      description: What was your network connection status when the issue occurred?
      options:
        - Online (Connected)
        - Offline (No Internet / Airplane Mode)
        - Slow / Flaky Connection
        - Unknown / Not Relevant
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the problem is.
      placeholder: "When opening chapter 3 of book #1342 in Bilingual mode..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '/read/1342'
        2. Click on '...'
        3. Highlight the sentence '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recording (Optional)
      description: Drag and drop screenshots, screen recordings, or GIFs showing the issue to help us diagnose quickly.
      placeholder: "Drag & drop images here..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console Error Logs (Optional)
      description: Paste any browser console errors or Web Worker termination stack traces.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-Submission Verification
      options:
        - label: I have verified that this issue is reproducible on the latest version.
          required: true
        - label: I have searched existing open and closed issues to ensure this is not a duplicate.
          required: true
